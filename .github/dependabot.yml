version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    
    ignore:
      - dependency-name: "@types/react"
        versions: [">= 19.0.0"]
      - dependency-name: "@types/react-dom"
        versions: [">= 19.0.0"]

    groups:
      version_updates:
        applies-to: "version-updates"
        patterns: ["*"]
      security_updates:
        applies-to: "security-updates"
        patterns: ["*"]

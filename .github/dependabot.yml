version: 2
updates:
  # 1. Configuración para Node.js / npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly" # Cambia a "daily" si prefieres que revise todos los días
    
    # Aquí forzamos el agrupamiento absoluto
    groups:
      # Grupo para actualizaciones de versiones estándar
      actualizaciones-versiones:
        applies-to: "version-updates"
        patterns:
          - "*" # Aplica a todos los paquetes
          
      # Grupo para parches de seguridad (Evita que salgan 1 a 1)
      actualizaciones-seguridad:
        applies-to: "security-updates"
        patterns:
          - "*" # Aplica a todas las alertas de seguridad
          
